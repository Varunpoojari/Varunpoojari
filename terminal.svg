<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-label="Animated terminal showing a SOC triage session">
  <defs>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:14px}
      .l{opacity:0;animation:show .01s forwards}
      @keyframes show{to{opacity:1}}
      .l1{animation-delay:.4s}.l2{animation-delay:1.4s}.l3{animation-delay:2.1s}.l4{animation-delay:2.8s}
      .l5{animation-delay:3.6s}.l6{animation-delay:4.4s}.l7{animation-delay:5.2s}.l8{animation-delay:6.0s}
      .l9{animation-delay:6.8s}.l10{animation-delay:7.6s}.l11{animation-delay:8.4s}
      .cur{animation:b 1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
    </style>
  </defs>
  <rect width="800" height="330" rx="10" fill="#0d1117"/>
  <rect x=".5" y=".5" width="799" height="329" rx="10" fill="none" stroke="#30363d"/>
  <rect width="800" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="800" height="10" fill="#161b22"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="400" y="22" text-anchor="middle" class="m" font-size="12" fill="#8b949e">varun@soc-lab: ~/triage</text>

  <g class="m" xml:space="preserve">
    <text x="20" y="64" class="l l1" fill="#00d4ff">$ <tspan fill="#c9d1d9">python3 llm_triage.py --source splunk --window 15m</tspan></text>
    <text x="20" y="90" class="l l2" fill="#8b949e">[*] Pulling alerts from SIEM ............ 42 events</text>
    <text x="20" y="112" class="l l3" fill="#8b949e">[*] Enriching IOCs (hash / IP / domain) .. done</text>
    <text x="20" y="134" class="l l4" fill="#8b949e">[*] Mapping to MITRE ATT&amp;CK ............. done</text>
    <text x="20" y="160" class="l l5" fill="#ff5f56">[!] HIGH   T1059.001  PowerShell encoded command   host=WS-07</text>
    <text x="20" y="182" class="l l6" fill="#ffbd2e">[~] MED    T1110      Brute force attempts         src=185.x.x.x</text>
    <text x="20" y="204" class="l l7" fill="#27c93f">[+] LOW    T1046      Internal port scan (approved) host=VULN-SCN</text>
    <text x="20" y="232" class="l l8" fill="#00d4ff">$ <tspan fill="#c9d1d9">./llm_redteam --target chatbot --owasp-llm LLM01</tspan></text>
    <text x="20" y="256" class="l l9" fill="#ff5f56">[!] Prompt injection succeeded → mapped to ATLAS AML.T0051</text>
    <text x="20" y="278" class="l l10" fill="#27c93f">[+] Findings + remediation written to report.md</text>
    <text x="20" y="306" class="l l11" fill="#00d4ff">$ <tspan class="cur" fill="#00ff9c">█</tspan></text>
  </g>
</svg>

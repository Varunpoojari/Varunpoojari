<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Varun Poojari — AI Security | SOC | Offensive Security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080d"/>
      <stop offset="1" stop-color="#0b1a14"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff9c" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
      .blink{animation:b 1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .sweep{animation:s 4s linear infinite}
      @keyframes s{from{transform:translateY(-80px)}to{transform:translateY(260px)}}
      .pulse{animation:p 2s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="14" fill="url(#grid)"/>
  <rect class="sweep" x="0" y="0" width="1000" height="70" fill="url(#scan)"/>
  <rect x="1" y="1" width="998" height="238" rx="13" fill="none" stroke="#00ff9c" stroke-opacity="0.35"/>

  <!-- shield glyph -->
  <g transform="translate(830 52)" class="pulse">
    <path d="M65 0 L125 22 V70 C125 108 98 132 65 144 C32 132 5 108 5 70 V22 Z" fill="none" stroke="#00ff9c" stroke-width="2.5"/>
    <path d="M65 16 L111 33 V70 C111 99 91 118 65 128 C39 118 19 99 19 70 V33 Z" fill="#00ff9c" fill-opacity="0.06" stroke="#00d4ff" stroke-opacity="0.6"/>
    <rect x="46" y="66" width="38" height="30" rx="4" fill="none" stroke="#00ff9c" stroke-width="2.5"/>
    <path d="M53 66 V56 a12 12 0 0 1 24 0 V66" fill="none" stroke="#00ff9c" stroke-width="2.5"/>
    <circle cx="65" cy="80" r="3.5" fill="#00ff9c"/>
  </g>

  <text x="48" y="58" class="mono" font-size="15" fill="#00d4ff">root@dublin:~$ <tspan fill="#c9d1d9">whoami</tspan></text>
  <text x="48" y="112" class="mono" font-size="44" font-weight="700" fill="#e6edf3">VARUN POOJARI</text>
  <text x="48" y="148" class="mono" font-size="17" fill="#00ff9c">AI Security Intern @ Rakfort  //  SOC Analyst  //  CEHv12</text>
  <text x="48" y="186" class="mono" font-size="14" fill="#8b949e">[ LLM Security ] [ Threat Detection ] [ Incident Response ] [ Pentesting ]</text>
  <text x="48" y="214" class="mono" font-size="13" fill="#8b949e">📍 Dublin, Ireland  ·  MSc Cyber Security, NCI  ·  <tspan fill="#00ff9c">open to SOC / Security roles</tspan><tspan class="blink" fill="#00ff9c"> █</tspan></text>
</svg>
